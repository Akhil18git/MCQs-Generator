<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>QuizForge</title>
  <link rel='stylesheet' href='{{ url_for("static", filename="css/main.css") }}'>
</head>
<body>
  <div class='container'>
    <h1>Upload a document to generate MCQs</h1>
    <form method='POST' action='/generate' enctype='multipart/form-data'>
      <label for='file'>Choose a file (PDF, DOCX, TXT):</label>
      <input type='file' name='file' id='file' required>
      <label for='num_questions'>Number of questions:</label>
      <input type='number' name='num_questions' id='num_questions' min='1' value='5' required>
      <label for='difficulty'>Difficulty:</label>
      <select name='difficulty' id='difficulty'>
        <option value='easy'>Easy</option>
        <option value='medium' selected>Medium</option>
        <option value='hard'>Hard</option>
      </select>
      <button type='submit'>Generate MCQs</button>
    </form>
  </div>
</body>
</html>
