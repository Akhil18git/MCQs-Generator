<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCQ Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .form-section {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }
    .form-section.show {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <div class="card-body">
            <h2 class="text-center mb-4">📝 MCQ Generator</h2>
            <p class="text-center text-muted mb-4">
              Upload a PDF, DOCX, or TXT file and generate multiple-choice questions in seconds.
            </p>
            <form method="POST" action="/generate" enctype="multipart/form-data" id="mcqForm">
              <!-- Step 1: File Upload -->
              <div class="mb-3">
                <!--<label for="file" class="form-label">Choose a file (PDF, DOCX, or TXT):</label>-->
                <input class="form-control" type="file" name="file" id="file" accept=".pdf,.docx,.txt" required>
              </div>

              <!-- Step 2: Number of Questions (hidden initially) -->
              <div id="questionSection" class="form-section">
                <div class="mb-3">
                  <label for="num_questions" class="form-label">Number of Questions:</label>
                  <input class="form-control" type="number" name="num_questions" id="num_questions" min="1" value="" placeholder="enter number" required>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">🚀 Generate MCQs</button>
                </div>
              </div>
            </form>
          </div>
        </div>
        <p class="text-center text-muted mt-3" style="font-size: 0.9rem;">
          Powered by LLMs • Made with ❤️ by Akhil
        </p>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const questionSection = document.getElementById('questionSection');

    fileInput.addEventListener('change', function () {
      if (fileInput.files.length > 0) {
        questionSection.classList.add('show');
      } else {
        questionSection.classList.remove('show');
      }
    });
  </script>
</body>
</html>
